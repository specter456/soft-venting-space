<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Venting</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Venting" />
    <script>
      // PWA install support (Chrome/Edge fire this; iOS Safari shows share-menu instructions)
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        window.__ventingInstallPrompt = event;
        window.dispatchEvent(new CustomEvent("venting-install-ready"));
      });
      // Service worker (offline). Skipped on localhost so dev stays fresh.
      if ("serviceWorker" in navigator && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {
            /* offline mode simply won't be available — the app still works */
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
