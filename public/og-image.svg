<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF5E6"/>
      <stop offset="50%" stop-color="#EDEBF6"/>
      <stop offset="100%" stop-color="#D9DEF4"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdb9f2"/>
      <stop offset="55%" stop-color="#e9c6d3"/>
      <stop offset="100%" stop-color="#f7d2a9"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- soft blobs -->
  <circle cx="200" cy="150" r="200" fill="#AAB6E3" opacity="0.2"/>
  <circle cx="1000" cy="500" r="250" fill="#F3E7C9" opacity="0.2"/>
  <circle cx="600" cy="100" r="160" fill="#C4CBE8" opacity="0.15"/>
  <!-- logo squircle -->
  <rect x="520" y="100" width="160" height="160" rx="48" fill="url(#logoGrad)"/>
  <!-- heart -->
  <path d="M600 220 C 580 205, 540 185, 540 160 C 540 145, 555 132, 575 132 C 590 132, 598 140, 600 148 C 602 140, 610 132, 625 132 C 645 132, 660 145, 660 160 C 660 185, 620 205, 600 220Z" fill="#fffdf8"/>
  <!-- sparkles -->
  <circle cx="645" cy="118" r="5" fill="#fffdf8" opacity="0.9"/>
  <circle cx="660" cy="140" r="3.5" fill="#fffdf8" opacity="0.7"/>
  <circle cx="540" cy="225" r="4" fill="#fffdf8" opacity="0.7"/>
  <!-- name -->
  <text x="600" y="320" text-anchor="middle" font-family="'Caveat','Comic Sans MS',cursive" font-size="72" font-weight="700" fill="#3A4170">Venting</text>
  <!-- tagline -->
  <text x="600" y="370" text-anchor="middle" font-family="'Caveat','Comic Sans MS',cursive" font-size="32" font-weight="600" fill="#555B8A">a tiny safe room in your phone</text>
  <!-- small line -->
  <text x="600" y="420" text-anchor="middle" font-family="'Nunito',sans-serif" font-size="18" font-weight="600" fill="#7A7FA8">private &amp; safe · no judgment, ever</text>
</svg>
